name: experiment-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen
      - name: Unit and artifact regression tests
        run: uv run pytest
      - name: End-to-end smoke experiment
        run: >-
          uv run reframe-experiment
          --train-seeds 8
          --test-seeds 8
          --budgets 500
          --main-budget 500
          --bootstrap-samples 200
          --output-root .ci-output
